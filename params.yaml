preprocess:
  image_size_2d: [224, 224]
  volume_size_3d: [96, 96, 96]
  hu_min: -1000.0
  hu_max: 400.0
  seed: 42

train_classifier:
  dataset: "NIH-ChestX-ray14 / RSNA-Pneumonia"
  backbone: "densenet121"
  num_classes: 14
  learning_rate: 0.0001
  batch_size: 32
  epochs: 15

train_segmentation:
  dataset: "Medical Segmentation Decathlon Task06_Lung"
  architecture: "MONAI-3D-UNet"
  in_channels: 1
  out_channels: 2
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  learning_rate: 0.0003
  epochs: 50
